version: 2.1
orbs:
  cypress: cypress-io/cypress@6
jobs:
  run-cypress-in-specified-node-version:
    docker:
      - image: cimg/node:25.4.0-browsers
        environment:
            INSTALL_XFVB: 0
            DISPLAY: ""
    environment:
      DEBUG: "cypress:cli"
    steps:
      - cypress/install:
          package-manager: "npm"
      - cypress/run-tests:
          start-command: "npm run start:dev"
          cypress-command: "npx cypress run"
workflows:
  test-workflow:
    jobs:
      - run-cypress-in-specified-node-version:
          name: Run Cypress in Node 24.5.0